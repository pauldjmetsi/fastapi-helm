apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "fastapi-app.fullname" . }}-tls
spec:
  secretName: {{ .Values.ingress.tlsSecret }}

  dnsNames:
    - {{ printf "%s.%s" .Values.ingress.appName .Values.ingress.nipDomain | quote }}

  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer